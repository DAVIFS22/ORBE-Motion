[package]
name = "orbe-motion"
description = "ORBE Motion — aplicativo profissional de animação e composição"
version = "0.2.7"
edition.workspace = true
license.workspace = true
default-run = "orbe-motion"

[lints]
workspace = true

[dependencies]
orbe-engine = { workspace = true }
orbe-host = { workspace = true }
orbe-ui-egui = { workspace = true }
egui = { workspace = true }

eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "links", "wayland", "x11"] }

serde_json = { workspace = true }
rfd = { workspace = true }
pollster = { workspace = true }
cpal = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false }

objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }

muda = { version = "0.21", default-features = false }

objc2 = "0.6"

objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSPasteboard"] }

fmv-macos-events = "=0.1.0"